<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>График дня</title>
    <link rel="stylesheet" href="style.css">
    <script src="season.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Подключение Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAPbpv2KRECXqg1z-vK_Z57ks9MH-ptBpU",
            authDomain: "plazixx.github.io",
            projectId: "servera1-f8968",
            storageBucket: "servera1-f8968.firebasestorage.app",
            messagingSenderId: "450676625930",
            appId: "1:450676625930:web:2ec0e25d3e54e24cd845f3",
            measurementId: "G-0781Q3WNR2"
        };
        const app = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(app);
        window.firebaseDB = getFirestore(app);
    </script>

    <style>
        .chart-page { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 1200px; margin: 0 auto; animation: fadeIn 0.5s ease-in-out; }
        .controls { display: flex; gap: 15px; background: #141414; padding: 20px; border: 1px solid #333; border-radius: 10px; align-items: center; flex-wrap: wrap; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .controls input, .controls select { padding: 12px; background: #050505; border: 1px solid #333; color: #fff; border-radius: 6px; outline: none; font-family: inherit; }
        .controls input:focus, .controls select:focus { border-color: var(--theme-color, #a3ff12); box-shadow: 0 0 10px var(--theme-color, #a3ff12); }
        .controls button { padding: 12px 25px; background: var(--theme-color, #a3ff12); color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .controls button:hover { background: #fff; box-shadow: 0 0 15px var(--theme-color, #a3ff12); }
        .graph-container { background: rgba(20, 20, 20, 0.85); border: 1px solid #333; border-radius: 12px; padding: 20px; height: 500px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        .history-table { width: 100%; border-collapse: collapse; background: #141414; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        .history-table th, .history-table td { padding: 15px; text-align: left; border-bottom: 1px solid #222; }
        .history-table th { background: #0a0a0a; color: var(--theme-color, #a3ff12); font-family: 'Courier New', monospace; letter-spacing: 1px; }
        .history-table tr:hover { background: rgba(255, 255, 255, 0.05); }
        .btn-delete-row { background: none; border: none; color: #ff3333; cursor: pointer; font-size: 1.2rem; transition: transform 0.2s; }
        .btn-delete-row:hover { transform: scale(1.2); }
    </style>
</head>
<body>
    <div class="neon-tree"><div class="star">★</div><div class="tree-triangle t1"></div><div class="tree-triangle t2"></div><div class="tree-triangle t3"></div><div class="tree-trunk"></div></div>
    <div class="container">
        <a href="index.html" class="back-btn">← Вернуться на главную</a>
        <header>
            <h1 class="neon-text">📊 График продуктивности</h1>
            <p style="color:#888; margin-top:5px; margin-bottom: 20px;">Отслеживайте свой прогресс. График строится по вашим записям.</p>
        </header>
        <div class="chart-page">
            <div class="controls">
                <input type="date" id="entry-date">
                <select id="entry-status">
                    <option value="1">🔴 Ничего не сделал</option>
                    <option value="2">🟡 Сделал 50 на 50</option>
                    <option value="3">🟢 Сделал всё, но вкрутце</option>
                    <option value="5">🔵 Сделал всё и ушёл в поток</option>
                    <option value="6">🟣 Сделал всё до конца</option>
                </select>
                <input type="text" id="entry-notes" placeholder="Заметки (что именно сделал?)" style="flex:1; min-width:200px;">
                <button onclick="addEntry()">Добавить запись</button>
            </div>
            <div class="graph-container"><canvas id="progressChart"></canvas></div>
            <h2 style="color: var(--theme-color, #a3ff12); margin-top: 20px;">История записей</h2>
            <div style="overflow-x: auto; border-radius: 10px; margin-bottom: 40px;">
                <table class="history-table"><thead><tr><th>Дата</th><th>Степень дня</th><th>Заметки</th><th>Действие</th></tr></thead><tbody id="historyBody"></tbody></table>
            </div>
        </div>
    </div>
    <script>
        const statusConfig = { "1": { label: "Ничего не сделал", weight: 1, color: "#ff3333" }, "2": { label: "Сделал 50 на 50", weight: 2, color: "#ffcc00" }, "3": { label: "Сделал всё, но вкрутце", weight: 3, color: "#4ec9b0" }, "5": { label: "Сделал всё и ушёл в поток", weight: 4, color: "#007acc" }, "6": { label: "Сделал всё до конца", weight: 5, color: "#a3ff12" } };
        let entries = [];
        let chartInstance = null;
        const today = new Date(); const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`; 
        document.getElementById('entry-date').value = todayStr;

        // Загрузка данных
        async function loadDataFromCloud() {
            // Сначала пробуем загрузить из локальной памяти (чтобы не терялось при обновлении)
            entries = JSON.parse(localStorage.getItem('dailyEntries')) || [];
            renderPage();

            // Если пользователь вошел, загружаем из облака
            if (window.currentUserId) {
                try {
                    const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                    const docSnap = await getDoc(doc(window.firebaseDB, "users", window.currentUserId, "data", "chart"));
                    if (docSnap.exists()) {
                        entries = docSnap.data().data;
                        localStorage.setItem('dailyEntries', JSON.stringify(entries)); // Сохраняем локально
                    }
                } catch (e) { 
                    console.error("Ошибка загрузки из облака:", e); 
                }
            }
            renderPage();
        }

        // Сохранение данных
        async function saveData() {
            // Всегда сохраняем локально
            localStorage.setItem('dailyEntries', JSON.stringify(entries));

            // Если пользователь вошел, сохраняем в облако
            if (window.currentUserId) {
                try {
                    const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                    await setDoc(doc(window.firebaseDB, "users", window.currentUserId, "data", "chart"), { data: entries });
                } catch (e) { 
                    console.error("Ошибка сохранения в облако:", e); 
                }
            }
        }

        function renderPage() { 
            renderTable(); 
            renderChart(); 
        }

        function renderTable() {
            const tbody = document.getElementById('historyBody'); 
            tbody.innerHTML = '';
            const sorted = [...entries].sort((a, b) => new Date(b.date) - new Date(a.date));
            sorted.forEach((entry) => { 
                const conf = statusConfig[entry.status]; 
                const tr = document.createElement('tr'); 
                const d = new Date(entry.date); 
                const dateStr = d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }); 
                tr.innerHTML = `<td style="color: #fff;">${dateStr}</td><td style="color: ${conf.color}; font-weight: bold;">${conf.label}</td><td style="color: #aaa;">${entry.notes || '-'}</td><td><button class="btn-delete-row" onclick="deleteEntry('${entry.id}')">🗑</button></td>`; 
                tbody.appendChild(tr); 
            });
            if (entries.length === 0) { 
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#555; padding: 20px;">Пока нет записей.</td></tr>`; 
            }
        }

        function renderChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            const dates = []; 
            for (let i = 13; i >= 0; i--) { 
                let d = new Date(); 
                d.setDate(d.getDate() - i); 
                const yyyy = d.getFullYear(); 
                const mm = String(d.getMonth() + 1).padStart(2, '0'); 
                const dd = String(d.getDate()).padStart(2, '0'); 
                dates.push(`${yyyy}-${mm}-${dd}`); 
            }
            const chartData = dates.map(date => { 
                const entry = entries.find(e => e.date === date); 
                return entry ? statusConfig[entry.status].weight : null; 
            });
            const chartLabels = dates.map(dateStr => { 
                const [y, m, d] = dateStr.split('-'); 
                return `${d}.${m}`; 
            });
            if (chartInstance) chartInstance.destroy();
            const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-color').trim() || '#a3ff12';
            
            chartInstance = new Chart(ctx, { 
                type: 'line', 
                data: { 
                    labels: chartLabels, 
                    datasets: [{ 
                        label: 'Продуктивность', 
                        data: chartData, 
                        borderColor: themeColor, 
                        backgroundColor: 'rgba(255, 255, 255, 0.1)', 
                        borderWidth: 3, 
                        pointBackgroundColor: themeColor, 
                        pointBorderColor: '#000', 
                        pointRadius: 6, 
                        pointHoverRadius: 9, 
                        spanGaps: true, 
                        tension: 0.3, 
                        fill: true 
                    }] 
                }, 
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    interaction: { mode: 'index', intersect: false }, 
                    plugins: { 
                        legend: { labels: { color: '#fff' } }, 
                        tooltip: { 
                            callbacks: { 
                                label: function(context) { 
                                    const dateStr = dates[context.dataIndex]; 
                                    const entry = entries.find(e => e.date === dateStr); 
                                    if (entry) { 
                                        return `Статус: ${statusConfig[entry.status].label} \nЗаметки: ${entry.notes || 'нет'}`; 
                                    } 
                                    return 'Нет записи'; 
                                } 
                            } 
                        } 
                    }, 
                    scales: { 
                        y: { 
                            beginAtZero: true, 
                            max: 5.5, 
                            ticks: { 
                                color: '#888', 
                                stepSize: 1, 
                                callback: function(value) { 
                                    const labels = {1: 'Ничего', 2: '50/50', 3: 'Вкратце', 4: 'В потоке', 5: 'До конца'}; 
                                    return labels[value] || ''; 
                                } 
                            }, 
                            grid: { color: '#222' } 
                        }, 
                        x: { 
                            ticks: { color: '#888' }, 
                            grid: { display: false } 
                        } 
                    } 
                } 
            });
        }

        function addEntry() { 
            const date = document.getElementById('entry-date').value; 
            const status = document.getElementById('entry-status').value; 
            const notes = document.getElementById('entry-notes').value.trim(); 
            if (!date) return alert("Выберите дату!"); 
            const existingIndex = entries.findIndex(e => e.date === date); 
            const newEntry = { id: Date.now().toString(), date, status, notes }; 
            if (existingIndex !== -1) entries[existingIndex] = newEntry; 
            else entries.push(newEntry); 
            document.getElementById('entry-notes').value = ''; 
            saveData(); 
            renderPage(); 
        }

        function deleteEntry(id) { 
            if (confirm("Удалить эту запись?")) { 
                entries = entries.filter(e => e.id !== id); 
                saveData(); 
                renderPage(); 
            } 
        }

        // Запускаем загрузку при старте
        if (window.currentUserId !== undefined) { 
            loadDataFromCloud(); 
        } else { 
            setTimeout(loadDataFromCloud, 1000); 
        }
    </script>
</body>
</html>
