<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мёртвая книга</title>
    <link rel="stylesheet" href="style.css">
    <script src="season.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "AIzaSyAPbpv2KRECXqg1z-vK_Z57ks9MH-ptBpU",
            authDomain: "plazixx.github.io",
            projectId: "servera1-f8968",
            storageBucket: "servera1-f8968.firebasestorage.app",
            messagingSenderId: "450676625930",
            appId: "1:450676625930:web:2ec0e25d3e54e24cd845f3",
            measurementId: "G-0781Q3WNR2"
        };
        const app = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(app);
        window.firebaseDB = getFirestore(app);
    </script>
    <style>
        .notebook-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .note-form { background: #141414; border: 1px solid #333; border-radius: 10px; padding: 20px; margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .note-form input, .note-form textarea { padding: 12px; background: #050505; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 1rem; outline: none; transition: border 0.3s; font-family: inherit; }
        .note-form input:focus, .note-form textarea:focus { border-color: #ff3333; box-shadow: 0 0 10px rgba(255, 51, 51, 0.2); }
        .note-form textarea { resize: vertical; min-height: 80px; }
        .note-form button { background: #ff3333; color: #fff; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: all 0.3s; align-self: flex-start; }
        .note-form button:hover { background: #fff; color: #ff3333; box-shadow: 0 0 15px rgba(255, 51, 51, 0.5); }
        .notes-container { display: flex; flex-direction: column; gap: 20px; }
        .note-card { background: #111; border: 1px solid #222; border-left: 6px solid #ff3333; border-radius: 10px; padding: 25px; position: relative; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: slideUp 0.4s ease-out; }
        .note-card:hover { border-color: #444; transform: translateX(5px); background: #161616; }
        .note-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .note-title { color: #ff3333; font-size: 1.3rem; margin: 0; font-weight: bold; }
        .note-date { font-family: 'Courier New', monospace; font-size: 0.8rem; color: #666; }
        .note-content { color: #aaa; line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; margin-bottom: 15px; }
        .note-actions { display: flex; justify-content: flex-end; gap: 10px; border-top: 1px dashed #333; padding-top: 15px; }
        .btn-delete-note { background: transparent; border: 1px solid #ff3333; color: #ff3333; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .btn-delete-note:hover { background: #ff3333; color: #000; }
    </style>
</head>
<body>
    <div class="neon-tree"><div class="star">★</div><div class="tree-triangle t1"></div><div class="tree-triangle t2"></div><div class="tree-triangle t3"></div><div class="tree-trunk"></div></div>
    <div class="container">
        <a href="index.html" class="back-btn">← Вернуться на главную</a>
        <div class="notebook-header">
            <header>
                <h1 class="neon-text" style="color: #ff3333; text-shadow: 0 0 15px rgba(255, 51, 51, 0.5);">💀 Мёртвая книга</h1>
                <p style="color:#888; margin-top:5px;">Архив заброшенных идей и проектов.</p>
            </header>
        </div>
        <div class="note-form">
            <input type="text" id="note-title" placeholder="Название проекта / идеи...">
            <textarea id="note-desc" placeholder="Причина смерти, детали или просто заметка..."></textarea>
            <button onclick="addNote()">Похоронить идею (Добавить)</button>
        </div>
        <div class="notes-container" id="notes-container"></div>
    </div>
    <script>
        let notes = [];
        async function loadDataFromCloud() {
            if (!window.currentUserId) { notes = JSON.parse(localStorage.getItem('deadBookNotes')) || []; renderNotes(); return; }
            try {
                const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                const docSnap = await getDoc(doc(window.firebaseDB, "users", window.currentUserId, "data", "deadBook"));
                if (docSnap.exists()) { notes = docSnap.data().data; }
            } catch (e) { console.error(e); notes = JSON.parse(localStorage.getItem('deadBookNotes')) || []; }
            renderNotes();
        }
        async function saveData() {
            if (!window.currentUserId) { localStorage.setItem('deadBookNotes', JSON.stringify(notes)); return; }
            try {
                const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                await setDoc(doc(window.firebaseDB, "users", window.currentUserId, "data", "deadBook"), { data: notes });
            } catch (e) { console.error(e); localStorage.setItem('deadBookNotes', JSON.stringify(notes)); }
        }
        function renderNotes() {
            const container = document.getElementById('notes-container'); container.innerHTML = '';
            const sortedNotes = [...notes].sort((a, b) => b.id - a.id);
            sortedNotes.forEach(note => {
                const card = document.createElement('div'); card.className = 'note-card';
                card.innerHTML = `<div class="note-header"><h3 class="note-title">${note.title}</h3><span class="note-date">${note.date}</span></div><div class="note-content">${note.desc}</div><div class="note-actions"><button class="btn-delete-note" onclick="deleteNote(${note.id})">🗑 Удалить</button></div>`;
                container.appendChild(card);
            });
            if (notes.length === 0) { container.innerHTML = '<p style="color:#555; font-style:italic; text-align:center; padding: 20px;">Мёртвая книга пуста. Пока что...</p>'; }
            saveData();
        }
        function addNote() { const title = document.getElementById('note-title').value.trim(); const desc = document.getElementById('note-desc').value.trim(); if (title === '' || desc === '') { return alert("Заполните название и описание!"); } const now = new Date(); const dateStr = now.toLocaleDateString('ru-RU'); const newNote = { id: Date.now(), title: title, desc: desc, date: dateStr }; notes.push(newNote); document.getElementById('note-title').value = ''; document.getElementById('note-desc').value = ''; renderNotes(); }
        function deleteNote(id) { if (confirm("Вы уверены, что хотите удалить эту запись из архива?")) { notes = notes.filter(note => note.id !== id); renderNotes(); } }
        if (window.currentUserId !== undefined) { loadDataFromCloud(); } else { setTimeout(loadDataFromCloud, 1000); }
    </script>
</body>
</html>
