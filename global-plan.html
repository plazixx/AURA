<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глобальный план проект</title>
    <link rel="stylesheet" href="style.css">
    <script src="season.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAPbpv2KRECXqg1z-vK_Z57ks9MH-ptBpU",
            authDomain: "servera1-f8968.firebaseapp.com",
            projectId: "servera1-f8968",
            storageBucket: "servera1-f8968.firebasestorage.app",
            messagingSenderId: "450676625930",
            appId: "1:450676625930:web:2ec0e25d3e54e24cd845f3",
            measurementId: "G-0781Q3WNR2"
        };
        const app = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(app);
        window.firebaseDB = getFirestore(app);
    </script>
    <style>
        body { background-image: radial-gradient(circle at 15% 50%, rgba(255, 102, 0, 0.03) 0%, transparent 40%), radial-gradient(circle at 85% 30%, rgba(255, 102, 0, 0.03) 0%, transparent 40%), linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px); background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px; }
        .plan-dashboard { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-card { background: #141414; border: 1px solid #333; border-radius: 10px; padding: 20px; flex: 1; min-width: 150px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .stat-number { font-size: 2.5rem; color: var(--theme-color, #a3ff12); font-weight: bold; text-shadow: 0 0 10px var(--theme-color, #a3ff12); }
        .stat-label { color: #888; font-family: 'Courier New', monospace; font-size: 0.9rem; margin-top: 5px; }
        .plan-form { background: #141414; border: 1px solid #333; border-radius: 10px; padding: 20px; margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .plan-form.hidden { display: none; }
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; }
        .plan-form input, .plan-form select, .plan-form textarea { padding: 12px; background: #050505; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 1rem; outline: none; transition: border 0.3s; font-family: inherit; }
        .plan-form input:focus, .plan-form select:focus, .plan-form textarea:focus { border-color: var(--theme-color, #a3ff12); }
        .plan-form input[type="text"] { flex: 1; min-width: 200px; }
        .plan-form textarea { resize: vertical; min-height: 100px; width: 100%; }
        .form-buttons { display: flex; gap: 10px; }
        .plan-form button { background: var(--theme-color, #a3ff12); color: #000; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: all 0.3s; }
        .plan-form button:hover { background: #fff; box-shadow: 0 0 15px var(--theme-color, #a3ff12); }
        .btn-cancel { background: transparent; color: #ff3333; border: 1px solid #ff3333; }
        .btn-cancel:hover { background: #ff3333; color: #000; box-shadow: 0 0 15px rgba(255, 51, 51, 0.5); }
        .plans-container { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .plan-card { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(10px); border: 1px solid #333; border-radius: 12px; padding: 25px; position: relative; transition: all 0.3s; border-left: 6px solid var(--theme-color, #a3ff12); }
        .plan-card.completed { opacity: 0.6; border-left-color: #555; background: rgba(10,10,10,0.9); }
        .plan-card.completed h3 { text-decoration: line-through; color: #777; }
        .plan-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .plan-title { color: var(--theme-color, #a3ff12); font-size: 1.4rem; margin: 0; }
        .plan-meta { display: flex; gap: 15px; font-size: 0.9rem; color: #888; margin-bottom: 15px; flex-wrap: wrap; }
        .meta-tag { background: #1a1a1a; padding: 4px 10px; border-radius: 4px; border: 1px solid #333; display: flex; align-items: center; gap: 5px; }
        .meta-tag.urgent { color: #ff3333; border-color: #ff3333; animation: pulseRed 2s infinite; }
        .meta-tag.date { color: var(--theme-color, #4ec9b0); border-color: var(--theme-color, #4ec9b0); }
        .plan-content { color: #bbb; line-height: 1.6; margin-bottom: 20px; font-size: 0.95rem; }
        .subtask-list { list-style: none; padding: 0; margin-top: 10px; }
        .subtask-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; cursor: pointer; }
        .subtask-checkbox { appearance: none; width: 18px; height: 18px; border: 2px solid #555; border-radius: 4px; cursor: pointer; margin-top: 3px; flex-shrink: 0; position: relative; transition: 0.2s; }
        .subtask-checkbox:checked { background: var(--theme-color, #a3ff12); border-color: var(--theme-color, #a3ff12); }
        .subtask-checkbox:checked::after { content: '✔'; position: absolute; color: #000; font-size: 12px; font-weight: bold; top: -1px; left: 2px; }
        .subtask-text { color: #ccc; transition: 0.2s; }
        .subtask-checkbox:checked + .subtask-text { text-decoration: line-through; color: #666; }
        .plan-actions { display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid #222; padding-top: 15px; }
        .btn-action { padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; transition: 0.2s; border: 1px solid; background: transparent; }
        .btn-complete { color: var(--theme-color, #4ec9b0); border-color: var(--theme-color, #4ec9b0); } .btn-complete:hover { background: var(--theme-color, #4ec9b0); color: #000; }
        .btn-edit { color: #ffcc00; border-color: #ffcc00; } .btn-edit:hover { background: #ffcc00; color: #000; }
        .btn-delete { color: #ff3333; border-color: #ff3333; } .btn-delete:hover { background: #ff3333; color: #000; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 51, 51, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); } }
    </style>
</head>
<body>
    <div class="neon-tree"><div class="star">★</div><div class="tree-triangle t1"></div><div class="tree-triangle t2"></div><div class="tree-triangle t3"></div><div class="tree-trunk"></div></div>
    <div class="container">
        <a href="index.html" class="back-btn">← Вернуться на главную</a>
        <header><h1 class="neon-text">🌍 Глобальный план проект</h1><p style="color:#888; margin-top:5px; margin-bottom: 30px;">Управляйте целями и отмечайте выполненные шаги.</p></header>
        <div class="plan-dashboard">
            <div class="stat-card"><div class="stat-number" id="stat-active">0</div><div class="stat-label">АКТИВНЫХ ЦЕЛЕЙ</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-completed">0</div><div class="stat-label">ЗАВЕРШЕНО</div></div>
        </div>
        <div class="plan-form" id="add-form">
            <h3 style="color:#fff; margin-bottom: 5px;">Добавить новую цель</h3>
            <div class="form-row"><input type="text" id="add-title" placeholder="Название плана..."><select id="add-category"><option value="Музыка">🎵 Музыка</option><option value="Работа">💻 Работа</option><option value="Творчество">📖 Творчество</option><option value="Соцсети">📱 Соцсети</option><option value="Другое">🎯 Другое</option></select></div>
            <div class="form-row"><input type="date" id="add-date"></div>
            <textarea id="add-desc" placeholder="Подробное описание. Каждый шаг пишите с новой строки, начиная с дефиса (-), чтобы создать чекбокс."></textarea>
            <div class="form-buttons"><button onclick="addPlan()">Добавить в план</button></div>
        </div>
        <div class="plan-form hidden" id="edit-form">
            <h3 style="color:#ffcc00; margin-bottom: 5px;">✏️ Редактировать цель</h3>
            <div class="form-row"><input type="text" id="edit-title" placeholder="Название плана..."><select id="edit-category"><option value="Музыка">🎵 Музыка</option><option value="Работа">💻 Работа</option><option value="Творчество">📖 Творчество</option><option value="Соцсети">📱 Соцсети</option><option value="Другое">🎯 Другое</option></select></div>
            <div class="form-row"><input type="date" id="edit-date"></div>
            <textarea id="edit-desc"></textarea>
            <div class="form-buttons"><button onclick="saveEdit()" style="background:#ffcc00;">Сохранить изменения</button><button class="btn-cancel" onclick="cancelEdit()">Отмена</button></div>
        </div>
        <h2 style="color: var(--theme-color, #a3ff12); margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px;">Активные цели</h2>
        <div class="plans-container" id="active-plans"></div>
        <h2 style="color: #777; margin-bottom: 20px; margin-top: 40px; border-bottom: 1px solid #333; padding-bottom: 10px;">Выполненные цели</h2>
        <div class="plans-container" id="completed-plans"></div>
    </div>
    <script>
        const defaultPlans = [];
        let plans = defaultPlans;
        let currentEditId = null;

        async function loadDataFromCloud() {
            if (!window.currentUserId) { plans = JSON.parse(localStorage.getItem('globalPlansV2')) || defaultPlans; renderPlans(); return; }
            try {
                const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                const docSnap = await getDoc(doc(window.firebaseDB, "users", window.currentUserId, "data", "plans"));
                if (docSnap.exists()) { plans = docSnap.data().data; }
            } catch (e) { console.error(e); plans = JSON.parse(localStorage.getItem('globalPlansV2')) || defaultPlans; }
            renderPlans();
        }

        async function saveData() {
            if (!window.currentUserId) { localStorage.setItem('globalPlansV2', JSON.stringify(plans)); return; }
            try {
                const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                await setDoc(doc(window.firebaseDB, "users", window.currentUserId, "data", "plans"), { data: plans });
            } catch (e) { console.error(e); localStorage.setItem('globalPlansV2', JSON.stringify(plans)); }
        }

        function parseDesc(plan) {
            const lines = plan.desc.split('\n'); let html = ''; let subIndex = 0;
            lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed.startsWith('-') || trimmed.startsWith('•')) {
                    const text = trimmed.substring(1).trim(); const isChecked = plan.subtasks && plan.subtasks[subIndex] ? 'checked' : '';
                    html += `<li class="subtask-item" onclick="toggleSubtask(${plan.id}, ${subIndex})"><input type="checkbox" class="subtask-checkbox" ${isChecked} onclick="event.stopPropagation(); toggleSubtask(${plan.id}, ${subIndex})"><span class="subtask-text">${text}</span></li>`;
                    subIndex++;
                } else if (trimmed !== '') { html += `<p style="margin-bottom: 10px;">${trimmed}</p>`; }
            });
            if (subIndex > 0) { html = `<p style="margin-bottom: 5px;">${lines[0].includes('-') ? '' : lines[0]}</p><ul class="subtask-list">${html}</ul>`; }
            return html;
        }

        function renderPlans() {
            const activeContainer = document.getElementById('active-plans'); const completedContainer = document.getElementById('completed-plans');
            activeContainer.innerHTML = ''; completedContainer.innerHTML = ''; let activeCount = 0, completedCount = 0;
            plans.forEach(plan => {
                const today = new Date(); today.setHours(0,0,0,0); const planDate = plan.date ? new Date(plan.date) : null;
                if (planDate) planDate.setHours(0,0,0,0);
                const isUrgent = !plan.completed && planDate && planDate < today; const isToday = !plan.completed && planDate && planDate.getTime() === today.getTime();
                let dateStr = ""; let dateClass = "";
                if (plan.date) { dateStr = new Date(plan.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' }); dateClass = isUrgent ? "urgent" : "date"; }
                const cardHTML = `
                    <div class="plan-card ${plan.completed ? 'completed' : ''}">
                        <div class="plan-header"><h3 class="plan-title">${plan.title}</h3></div>
                        <div class="plan-meta"><span class="meta-tag">📁 ${plan.category}</span>${plan.date ? `<span class="meta-tag ${dateClass}">📅 ${isUrgent ? 'ПРОСРОЧЕНО: ' : 'До: '} ${dateStr}</span>` : ''}${isToday ? `<span class="meta-tag urgent" style="color: #ffcc00; border-color:#ffcc00;">⏰ СЕГОДНЯ ДЕДЛАЙН</span>` : ''}</div>
                        <div class="plan-content">${parseDesc(plan)}</div>
                        <div class="plan-actions">
                            ${!plan.completed ? `<button class="btn-action btn-complete" onclick="completePlan(${plan.id})">✔ Завершить</button>` : `<span style="color: var(--theme-color, #4ec9b0); font-weight: bold; align-self: center; margin-right: auto;">Успешно завершено</span>`}
                            <button class="btn-action btn-edit" onclick="startEdit(${plan.id})">✏️ Изменить</button>
                            <button class="btn-action btn-delete" onclick="deletePlan(${plan.id})">🗑 Удалить</button>
                        </div>
                    </div>`;
                if (plan.completed) { completedContainer.innerHTML += cardHTML; completedCount++; }
                else { activeContainer.innerHTML += cardHTML; activeCount++; }
            });
            if (activeCount === 0) activeContainer.innerHTML = '<p style="color:#555; font-style:italic;">Нет активных целей.</p>';
            if (completedCount === 0) completedContainer.innerHTML = '<p style="color:#555; font-style:italic;">Пока нет завершенных целей.</p>';
            document.getElementById('stat-active').textContent = activeCount; document.getElementById('stat-completed').textContent = completedCount; saveData();
        }

        function addPlan() { const title = document.getElementById('add-title').value.trim(); const category = document.getElementById('add-category').value; const date = document.getElementById('add-date').value; const desc = document.getElementById('add-desc').value.trim(); if (title === '') return alert("Введите название!"); plans.unshift({ id: Date.now(), title, category, date, desc: desc || "Описание не добавлено.", subtasks: [], completed: false }); renderPlans(); document.getElementById('add-title').value = ''; document.getElementById('add-date').value = ''; document.getElementById('add-desc').value = ''; }
        function startEdit(id) { const plan = plans.find(p => p.id === id); if (!plan) return; currentEditId = id; document.getElementById('edit-title').value = plan.title; document.getElementById('edit-category').value = plan.category; document.getElementById('edit-date').value = plan.date || ''; document.getElementById('edit-desc').value = plan.desc; document.getElementById('add-form').classList.add('hidden'); document.getElementById('edit-form').classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function saveEdit() { const plan = plans.find(p => p.id === currentEditId); if (plan) { plan.title = document.getElementById('edit-title').value.trim(); plan.category = document.getElementById('edit-category').value; plan.date = document.getElementById('edit-date').value; plan.desc = document.getElementById('edit-desc').value.trim(); renderPlans(); } cancelEdit(); }
        function cancelEdit() { currentEditId = null; document.getElementById('edit-form').classList.add('hidden'); document.getElementById('add-form').classList.remove('hidden'); }
        function toggleSubtask(planId, subIndex) { const plan = plans.find(p => p.id === planId); if (plan) { if (!plan.subtasks) plan.subtasks = []; plan.subtasks[subIndex] = !plan.subtasks[subIndex]; renderPlans(); } }
        function completePlan(id) { const plan = plans.find(p => p.id === id); if (plan) { plan.completed = true; renderPlans(); } }
        function deletePlan(id) { if (confirm("Удалить этот план полностью?")) { plans = plans.filter(p => p.id !== id); renderPlans(); } }

        if (window.currentUserId !== undefined) { loadDataFromCloud(); } else { setTimeout(loadDataFromCloud, 1000); }
    </script>
</body>
</html>
