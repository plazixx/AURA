<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои финансы</title>
    <link rel="stylesheet" href="style.css">
    <script src="season.js"></script>
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "AIzaSyAPbpv2KRECXqg1z-vK_Z57ks9MH-ptBpU",
            authDomain: "plazixx.github.io",
            projectId: "servera1-f8968",
            storageBucket: "servera1-f8968.firebasestorage.app",
            messagingSenderId: "450676625930",
            appId: "1:450676625930:web:2ec0e25d3e54e24cd845f3",
            measurementId: "G-0781Q3WNR2"
        };
        const app = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(app);
        window.firebaseDB = getFirestore(app);
    </script>
    <style>
        .finance-dashboard { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .balance-card { background: #141414; border: 1px solid #333; border-radius: 12px; padding: 30px; flex: 1; min-width: 250px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .balance-amount { font-size: 3rem; font-weight: bold; color: var(--theme-color, #a3ff12); text-shadow: 0 0 15px var(--theme-color, #a3ff12); }
        .balance-label { color: #888; font-family: 'Courier New', monospace; margin-top: 5px; }
        .chart-container-fin { background: #141414; border: 1px solid #333; border-radius: 12px; padding: 20px; flex: 2; min-width: 300px; height: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        .add-trans-form { display: flex; gap: 10px; margin-bottom: 30px; background: #141414; padding: 20px; border-radius: 10px; border: 1px solid #333; flex-wrap: wrap; align-items: center; }
        .add-trans-form input, .add-trans-form select { padding: 12px; background: #050505; border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 1rem; outline: none; transition: border 0.3s; }
        .add-trans-form input:focus, .add-trans-form select:focus { border-color: var(--theme-color, #a3ff12); }
        .add-trans-form input[type="number"] { width: 120px; }
        .add-trans-form input[type="text"] { flex: 1; min-width: 150px; }
        .add-trans-form button { background: var(--theme-color, #a3ff12); color: #000; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .add-trans-form button:hover { background: #fff; box-shadow: 0 0 15px var(--theme-color, #a3ff12); }
        .history-table-fin { width: 100%; border-collapse: collapse; background: #141414; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        .history-table-fin th, .history-table-fin td { padding: 15px; text-align: left; border-bottom: 1px solid #222; }
        .history-table-fin th { background: #0a0a0a; color: var(--theme-color, #a3ff12); font-family: 'Courier New', monospace; letter-spacing: 1px; }
        .history-table-fin tr:hover { background: rgba(255, 255, 255, 0.05); }
        .income { color: #4ec9b0; font-weight: bold; }
        .expense { color: #ff3333; font-weight: bold; }
        .btn-delete-fin { background: none; border: none; color: #ff3333; cursor: pointer; font-size: 1.2rem; transition: transform 0.2s; }
        .btn-delete-fin:hover { transform: scale(1.2); }
    </style>
</head>
<body>
    <div class="neon-tree"><div class="star">★</div><div class="tree-triangle t1"></div><div class="tree-triangle t2"></div><div class="tree-triangle t3"></div><div class="tree-trunk"></div></div>
    <div class="container">
        <a href="index.html" class="back-btn">← Вернуться на главную</a>
        <header>
            <h1 class="neon-text">💰 Мои финансы</h1>
            <p style="color:#888; margin-top:5px; margin-bottom: 30px;">Управление доходами и расходами.</p>
        </header>
        
        <div class="finance-dashboard">
            <div class="balance-card">
                <div class="balance-amount" id="total-balance">0 ₽</div>
                <div class="balance-label">ОБЩИЙ БАЛАНС</div>
            </div>
            <div class="chart-container-fin">
                <canvas id="financeChart"></canvas>
            </div>
        </div>

        <div class="add-trans-form">
            <select id="trans-type">
                <option value="income">🟢 Доход</option>
                <option value="expense">🔴 Расход</option>
            </select>
            <input type="number" id="trans-amount" placeholder="Сумма" min="0">
            <input type="text" id="trans-desc" placeholder="Описание (на что потратил / откуда пришло)">
            <input type="date" id="trans-date">
            <button onclick="addTransaction()">Добавить</button>
        </div>

        <h2 style="color: var(--theme-color, #a3ff12); margin-bottom: 20px;">История операций</h2>
        <div style="overflow-x: auto; border-radius: 10px; margin-bottom: 40px;">
            <table class="history-table-fin">
                <thead><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Описание</th><th>Действие</th></tr></thead>
                <tbody id="finance-history"></tbody>
            </table>
        </div>
    </div>
    <script>
        let transactions = [];
        let financeChartInstance = null;
        const today = new Date(); const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        document.getElementById('trans-date').value = todayStr;

        async function loadDataFromCloud() {
            if (!window.currentUserId) { transactions = JSON.parse(localStorage.getItem('financeData')) || []; renderFinance(); return; }
            try {
                const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                const docSnap = await getDoc(doc(window.firebaseDB, "users", window.currentUserId, "data", "finance"));
                if (docSnap.exists()) { transactions = docSnap.data().data; }
            } catch (e) { console.error(e); transactions = JSON.parse(localStorage.getItem('financeData')) || []; }
            renderFinance();
        }

        async function saveData() {
            if (!window.currentUserId) { localStorage.setItem('financeData', JSON.stringify(transactions)); return; }
            try {
                const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                await setDoc(doc(window.firebaseDB, "users", window.currentUserId, "data", "finance"), { data: transactions });
            } catch (e) { console.error(e); localStorage.setItem('financeData', JSON.stringify(transactions)); }
        }

        function renderFinance() {
            let total = 0, income = 0, expense = 0;
            const tbody = document.getElementById('finance-history'); tbody.innerHTML = '';
            const sorted = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

            sorted.forEach(t => {
                const amount = parseFloat(t.amount);
                if (t.type === 'income') { total += amount; income += amount; } else { total -= amount; expense += amount; }
                const tr = document.createElement('tr');
                const d = new Date(t.date);
                const dateStr = d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const sign = t.type === 'income' ? '+' : '-';
                const cls = t.type === 'income' ? 'income' : 'expense';
                tr.innerHTML = `<td style="color: #fff;">${dateStr}</td><td style="color: ${t.type === 'income' ? '#4ec9b0' : '#ff3333'};">${t.type === 'income' ? 'Доход' : 'Расход'}</td><td class="${cls}">${sign}${amount.toLocaleString('ru-RU')} ₽</td><td style="color: #aaa;">${t.desc || '-'}</td><td><button class="btn-delete-fin" onclick="deleteTransaction('${t.id}')">🗑</button></td>`;
                tbody.appendChild(tr);
            });

            document.getElementById('total-balance').textContent = `${total.toLocaleString('ru-RU')} ₽`;
            document.getElementById('total-balance').style.color = total >= 0 ? '#a3ff12' : '#ff3333';
            renderChart(income, expense);
            saveData();
        }

        function renderChart(income, expense) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (financeChartInstance) financeChartInstance.destroy();
            const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-color').trim() || '#a3ff12';
            financeChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Доходы', 'Расходы'],
                    datasets: [{
                        data: [income || 0, expense || 0],
                        backgroundColor: ['#4ec9b0', '#ff3333'],
                        borderColor: '#141414',
                        borderWidth: 4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#fff' } } } }
            });
        }

        function addTransaction() {
            const type = document.getElementById('trans-type').value;
            const amount = parseFloat(document.getElementById('trans-amount').value);
            const desc = document.getElementById('trans-desc').value.trim();
            const date = document.getElementById('trans-date').value;
            if (!amount || amount <= 0 || !date) return alert("Введите сумму и дату!");
            transactions.push({ id: Date.now().toString(), type, amount, desc, date });
            document.getElementById('trans-amount').value = ''; document.getElementById('trans-desc').value = '';
            renderFinance();
        }

        function deleteTransaction(id) {
            if (confirm("Удалить эту операцию?")) { transactions = transactions.filter(t => t.id !== id); renderFinance(); }
        }

        if (window.currentUserId !== undefined) { loadDataFromCloud(); } else { setTimeout(loadDataFromCloud, 1000); }
    </script>
</body>
</html>
