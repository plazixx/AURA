<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои достижения</title>
    <link rel="stylesheet" href="style.css">
    <script src="season.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "AIzaSyAPbpv2KRECXqg1z-vK_Z57ks9MH-ptBpU",
            authDomain: "plazixx.github.io",
            projectId: "servera1-f8968",
            storageBucket: "servera1-f8968.firebasestorage.app",
            messagingSenderId: "450676625930",
            appId: "1:450676625930:web:2ec0e25d3e54e24cd845f3",
            measurementId: "G-0781Q3WNR2"
        };
        const app = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(app);
        window.firebaseDB = getFirestore(app);
    </script>
</head>
<body>
    <div class="neon-tree"><div class="star">★</div><div class="tree-triangle t1"></div><div class="tree-triangle t2"></div><div class="tree-triangle t3"></div><div class="tree-trunk"></div></div>
    <div class="container">
        <a href="index.html" class="back-btn">← Вернуться на главную</a>
        <header>
            <h1 class="neon-text">🏆 Мои достижения</h1>
            <p style="color:#888; margin-top:5px; margin-bottom: 30px;">Коллекция ваших личных побед.</p>
        </header>
        <div class="achieve-form">
            <input type="text" id="achieve-title" placeholder="Название достижения (например: Выучил Python)">
            <textarea id="achieve-desc" placeholder="Описание (как вы этого добились?)..."></textarea>
            <div style="color: #aaa; font-size: 0.9rem;">Прикрепить фото (необязательно):</div>
            <input type="file" id="achieve-image" accept="image/*" style="border: none; padding: 0;">
            <button onclick="addAchievement()">Добавить достижение</button>
        </div>
        <div class="achievements-grid" id="achievements-grid"></div>
    </div>
    <script>
        let achievements = [];
        let currentImageBase64 = "";
        async function loadDataFromCloud() {
            if (!window.currentUserId) { achievements = JSON.parse(localStorage.getItem('myAchievements')) || []; renderAchievements(); return; }
            try {
                const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                const docSnap = await getDoc(doc(window.firebaseDB, "users", window.currentUserId, "data", "achievements"));
                if (docSnap.exists()) { achievements = docSnap.data().data; }
            } catch (e) { console.error(e); achievements = JSON.parse(localStorage.getItem('myAchievements')) || []; }
            renderAchievements();
        }
        async function saveData() {
            if (!window.currentUserId) { localStorage.setItem('myAchievements', JSON.stringify(achievements)); return; }
            try {
                const { doc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                await setDoc(doc(window.firebaseDB, "users", window.currentUserId, "data", "achievements"), { data: achievements });
            } catch (e) { console.error(e); localStorage.setItem('myAchievements', JSON.stringify(achievements)); }
        }
        document.getElementById('achieve-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) { currentImageBase64 = event.target.result; };
                reader.readAsDataURL(file);
            }
        });
        function addAchievement() {
            const title = document.getElementById('achieve-title').value.trim();
            const desc = document.getElementById('achieve-desc').value.trim();
            if (title === '') return alert("Введите название достижения!");
            const now = new Date(); const dateStr = now.toLocaleDateString('ru-RU');
            const newAchieve = { id: Date.now(), title: title, desc: desc, image: currentImageBase64, date: dateStr };
            achievements.push(newAchieve);
            document.getElementById('achieve-title').value = ''; document.getElementById('achieve-desc').value = ''; document.getElementById('achieve-image').value = ''; currentImageBase64 = "";
            renderAchievements();
        }
        function deleteAchievement(id) {
            if (confirm("Удалить это достижение из истории?")) {
                achievements = achievements.filter(a => a.id !== id);
                renderAchievements();
            }
        }
        function renderAchievements() {
            const grid = document.getElementById('achievements-grid'); grid.innerHTML = '';
            const sorted = [...achievements].sort((a, b) => b.id - a.id);
            sorted.forEach(achieve => {
                const card = document.createElement('div'); card.className = 'achieve-card';
                const imgHTML = achieve.image ? `<img src="${achieve.image}" class="achieve-img" style="display:block;">` : '';
                card.innerHTML = `${imgHTML}<div class="achieve-date">📅 ${achieve.date}</div><h3 class="achieve-title">${achieve.title}</h3><p class="achieve-desc">${achieve.desc || 'Без описания'}</p><button class="btn-delete-achieve" onclick="deleteAchievement(${achieve.id})">Удалить</button>`;
                grid.appendChild(card);
            });
            saveData();
        }
        if (window.currentUserId !== undefined) { loadDataFromCloud(); } else { setTimeout(loadDataFromCloud, 1000); }
    </script>
</body>
</html>
